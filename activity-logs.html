<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs - Qinwan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h1 class="logo">Qinwan</h1>
        <ul class="nav-links">
            <li><a href="index.html">Browse Farms</a></li>
            <li><a href="investor.html">Investor</a></li>
            <li><a href="farmer.html">Farmer</a></li>
            <li><a href="admin.html" class="active-admin-link">Admin</a></li>
            <li><a href="login.html">Sign In</a></li>
            <li><a href="register.html" class="btn">Get Started</a></li>
        </ul>
    </nav>
</header>

<main class="admin-page">
    <section class="admin-heading">
        <h2>Activity Logs</h2>
        <p>Audit system and user actions with timestamps and affected entities.</p>
    </section>

    <section class="admin-toolbar">
        <input type="text" id="logSearchInput" placeholder="Search by user name or action type">
    </section>

    <section class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>User Name</th>
                    <th>User ID</th>
                    <th>Action Type</th>
                    <th>Affected Entity</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="activityLogsTableBody"></tbody>
        </table>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
