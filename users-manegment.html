<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - Qinwan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h1 class="logo">Qinwan</h1>
        <ul class="nav-links">
            <li><a href="index.html">Browse Farms</a></li>
            <li><a href="investor.html">Investor</a></li>
            <li><a href="farmer.html">Farmer</a></li>
            <li><a href="admin.html" class="active-admin-link">Admin</a></li>
            <li><a href="login.html">Sign In</a></li>
            <li><a href="register.html" class="btn">Get Started</a></li>
        </ul>
    </nav>
</header>

<main class="admin-page">
    <section class="admin-heading">
        <h2>Users Management</h2>
        <p>Search, filter, verify, suspend, and review user details.</p>
    </section>

    <section class="admin-toolbar">
        <input type="text" id="userSearchInput" placeholder="Search by name or email">
        <select id="userRoleFilter">
            <option value="all">All Roles</option>
            <option value="Investor">Investor</option>
            <option value="Farm Owner">Farm Owner</option>
            <option value="Admin">Admin</option>
        </select>
        <select id="userStatusFilter">
            <option value="all">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Pending Verification">Pending Verification</option>
            <option value="Suspended">Suspended</option>
        </select>
    </section>

    <section class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Registration Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersManagementTableBody"></tbody>
        </table>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
