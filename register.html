<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قِنوان | إنشاء حساب</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="auth-container">
    <div class="auth-box" style="max-width:460px;">

      <!-- اللوقو — الاسم موجود في الصورة، لا يوجد نص إضافي -->
      <div class="auth-logo">
        <img class="auth-logo-img" src="logo.png" alt="قِنوان"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <div class="auth-logo-fallback" style="display:none">ق</div>
      </div>

      <h1>إنشاء حساب جديد</h1>
      <p>انضم إلى قِنوان كمستثمر أو مزارع</p>

      <div class="auth-ornament">
        <div class="line"></div>
        <div class="diamond"></div>
        <div class="line" style="transform:scaleX(-1)"></div>
      </div>

      <form id="registerForm">

        <!-- full_name في جدول User -->
        <label>الاسم الكامل</label>
        <input type="text" placeholder="أدخل اسمك الكامل" required />

        <!-- email في جدول User -->
        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="example@email.com" required />

        <!-- password_hash في جدول User -->
        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••••" required />

        <!-- role في جدول User -->
        <div class="role-label">أنا</div>
        <div class="role-buttons">
          <button type="button" class="role-btn active">مستثمر</button>
          <button type="button" class="role-btn">مزارع</button>
        </div>

        <button type="button" id="createAccountBtn" class="auth-btn">إنشاء الحساب</button>
      </form>

      <div class="auth-link">
        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
