<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Create Your Account</h1>
            <p>Join Qinwan as an investor, farm owner, or admin</p>
            <form>
                <label>Full Name</label>
                <input type="text" placeholder="Your full name" required>

                <label>Email</label>
                <input type="email" placeholder="you@example.com" required>

                <label>Password</label>
                <input type="password" placeholder="••••••••" required>

                <label>I am a</label>
                <div class="role-buttons">
                    <button type="button" class="role-btn active">Investor</button>
                    <button type="button" class="role-btn">Farm Owner</button>
                    <button type="button" class="role-btn">Admin</button>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>
            <div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
