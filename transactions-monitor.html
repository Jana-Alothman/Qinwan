<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقبة المعاملات - قنوان</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">

</head>
<body>

<header>
    <nav class="navbar">
        <h1 class="logo">Qinwan</h1>
        <ul class="nav-links">
            <li><a href="index.html">تصفح المزارع</a></li>
            <li><a href="investor.html">المستثمر</a></li>
            <li><a href="farmer.html">المزارع</a></li>
            <li><a href="admin.html" class="active-admin-link">الإدارة</a></li>
            <li><a href="login.html">تسجيل الدخول</a></li>
            <li><a href="register.html" class="btn">ابدأ الآن</a></li>
        </ul>
    </nav>
</header>

<main class="admin-page admin-rtl">
    <section class="admin-heading">
        <h2>مراقبة المعاملات</h2>
        <p>عرض جميع المعاملات الاستثمارية والتحقق من سلامتها المالية.</p>
    </section>

   <section class="admin-toolbar">
    <select id="transactionStatusFilter">
        <option value="all">كل الحالات</option>
        <option value="Pending">قيد المراجعة</option>
        <option value="Accepted">مقبولة</option>
        <option value="Rejected">مرفوضة</option>
        <option value="Completed">مكتملة</option>
    </select>

    <input type="date" id="transactionDateFrom" placeholder="من تاريخ">
    <input type="date" id="transactionDateTo" placeholder="إلى تاريخ">
</section>

    <section class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>اسم المستثمر</th>
                    <th>اسم المزارع</th>
                    <th>اسم المزرعة</th>
                    <th>المساحة</th>
                    <th>المدة</th>
                    <th>طريقة الحصاد</th>
                    <th>الحالة</th>
                    <th>التاريخ</th>
                    <th>التفاصيل</th>
                    <th>التنبيه</th>
                </tr>
            </thead>
            <tbody id="transactionsTableBody"></tbody>
        </table>
    </section>
</main>

<script src="script2.js"></script>
</body>
</html>
